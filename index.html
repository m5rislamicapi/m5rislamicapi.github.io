<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>جارٍ تحويل الرابط...</title>
  <script>
(() => {
  'use strict';

  // الروابط المستهدفة: استبدلها بنطاقاتك الحقيقية
  const DESTINATIONS = [
    'https://test.com',
    'https://test2.com'
  ];

  // البادئة المطلوب تجاهلها
  const IGNORED_PREFIX = '/m5rislamicapi-redir';

  // التحقق من الروابط وتجهيزها
  function normalizeDestination(value) {
    let text = String(value ?? '').trim();

    if (!text) return null;

    if (!/^https?:\/\//i.test(text)) {
      text = 'https://' + text;
    }

    try {
      const url = new URL(text);

      if (url.protocol !== 'http:' && url.protocol !== 'https:') {
        return null;
      }

      return url;
    } catch {
      return null;
    }
  }

  // تجهيز الوجهات واستبعاد النطاق الحالي
  const currentHost = window.location.hostname.toLowerCase();

  const destinations = DESTINATIONS
    .map(normalizeDestination)
    .filter(url =>
      url && url.hostname.toLowerCase() !== currentHost
    );

  // عرض رسالة إذا لم توجد وجهات صالحة
  function showError(message) {
    document.addEventListener('DOMContentLoaded', () => {
      document.body.textContent = message;
    });
  }

  if (destinations.length === 0) {
    showError('لا توجد روابط مستهدفة صالحة. تحقق من DESTINATIONS.');
    return;
  }

  // اختيار وجهة عشوائية
  const destination =
    destinations[Math.floor(Math.random() * destinations.length)];

  // قراءة المسار الأصلي
  let path = window.location.pathname || '/';

  // تجاهل البادئة في بداية المسار فقط
  const lowerPath = path.toLowerCase();
  const lowerPrefix = IGNORED_PREFIX.toLowerCase();

  if (
    lowerPath === lowerPrefix ||
    lowerPath.startsWith(lowerPrefix + '/')
  ) {
    path = path.slice(IGNORED_PREFIX.length) || '/';
  }

  // ضمان أن المسار يبدأ بشرطة مائلة
  if (!path.startsWith('/')) {
    path = '/' + path;
  }

  // اعتبار index.html هو المسار الأساسي
  if (/^\/index\.html\/?$/i.test(path)) {
    path = '/';
  }

  // دمج المسار المتبقي مع مسار الوجهة الأساسي
  const basePath =
    destination.pathname === '/'
      ? ''
      : destination.pathname.replace(/\/+$/, '');

  destination.pathname = basePath + path;

  // الحفاظ على معاملات الاستعلام والـ hash
  destination.search = window.location.search;
  destination.hash = window.location.hash;

  // الانتقال إلى الوجهة
  window.location.replace(destination.href);
})();
</script>
</head>
<body>
  <p>جارٍ تحويلك إلى الوجهة المناسبة...</p>
  <noscript>يلزم تفعيل JavaScript لإتمام التحويل.</noscript>
</body>
</html>
