<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>جارٍ تحويل الرابط...</title>
  <script>
(() => {
  'use strict';

  const TARGET_ORIGIN = 'https://m5rislamic-apigithubio.vercel.app';
  const IGNORED_PREFIX = '/m5rislamicapi-redir';

  // المسار الحالي
  let path = window.location.pathname || '/';

  const normalizedPath = path.toLowerCase();
  const prefix = IGNORED_PREFIX.toLowerCase();

  // تجاهل اسم المستودع فقط إذا كان في بداية المسار
  if (
    normalizedPath === prefix ||
    normalizedPath.startsWith(prefix + '/')
  ) {
    path = path.slice(IGNORED_PREFIX.length) || '/';
  }

  // المسار الأساسي يجب أن يكون /
  if (!path) {
    path = '/';
  }

  // index.html يعادل المسار الأساسي
  if (/^\/index\.html\/?$/i.test(path)) {
    path = '/';
  }

  // إنشاء الرابط النهائي
  const target = new URL(TARGET_ORIGIN);
  target.pathname = path;
  target.search = window.location.search;
  target.hash = window.location.hash;

  // تنفيذ التحويل
  window.location.replace(target.href);
})();
</script>
</head>
<body>
  <p>جارٍ تحويلك إلى الوجهة المناسبة...</p>
  <noscript>يلزم تفعيل JavaScript لإتمام التحويل.</noscript>
</body>
</html>
