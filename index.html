<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>جارٍ تحويل الرابط...</title>
  <script>
  (() => {
    'use strict';

    // الوجهة التي تم التحقق من أنها تعمل.
    const TARGET_ORIGIN = 'https://m5rislamicapi.vercel.app';
    // اسم المستودع الذي يجب تجاهله عندما يظهر كبادئة للمسار.
    const REPOSITORY_PREFIX = '/m5rislamicapi-redir';

    let path = window.location.pathname || '/';
    const prefix = REPOSITORY_PREFIX.toLowerCase();
    const currentPath = path.toLowerCase();

    // /m5rislamicapi-redir/            -> /
    // /m5rislamicapi-redir/ebtihalat/  -> /ebtihalat/
    // /ebtihalat/                      -> /ebtihalat/
    if (currentPath === prefix || currentPath === prefix + '/') {
      path = '/';
    } else if (currentPath.startsWith(prefix + '/')) {
      path = path.slice(REPOSITORY_PREFIX.length) || '/';
    }

    // index.html هو المسار الأساسي.
    if (/^\/index\.html\/?$/i.test(path)) path = '/';
    if (!path.startsWith('/')) path = '/' + path;

    const target = new URL(TARGET_ORIGIN);
    target.pathname = path;
    target.search = window.location.search;
    target.hash = window.location.hash;

    window.location.replace(target.href);
  })();
  </script>
</head>
<body>
  <p>جارٍ تحويلك إلى الموقع...</p>
  <noscript>يرجى تفعيل JavaScript لإتمام إعادة التوجيه.</noscript>
</body>
</html>
