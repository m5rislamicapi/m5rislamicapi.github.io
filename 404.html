<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <title>جارٍ تحويل الرابط...</title>
  <script>
  (() => {
    'use strict';
  
    // الوجهة المؤكدة حاليًا. لا تضف النطاق الثاني حتى يُصلح خطأ 404.
    const TARGET_ORIGIN = 'https://m5rislamic-apigithubio.vercel.app';
    const REPOSITORY_PREFIX = '/m5rislamicapi-redir';
  
    let path = window.location.pathname || '/';
    const decodedPrefix = REPOSITORY_PREFIX.toLowerCase();
    const currentPathLower = path.toLowerCase();
  
    // احذف اسم المستودع فقط عندما يكون بادئة للمسار.
    // /m5rislamicapi-redir/             => /
    // /m5rislamicapi-redir/ebtihalat/   => /ebtihalat/
    // /ebtihalat/                       => /ebtihalat/
    if (currentPathLower === decodedPrefix || currentPathLower === decodedPrefix + '/') {
      path = '/';
    } else if (currentPathLower.startsWith(decodedPrefix + '/')) {
      path = path.slice(REPOSITORY_PREFIX.length) || '/';
    }
  
    // index.html يعادل المسار الأساسي.
    if (/^\/index\.html\/?$/i.test(path)) path = '/';
    if (!path.startsWith('/')) path = '/' + path;
  
    const target = new URL(TARGET_ORIGIN);
    target.pathname = path;
    target.search = window.location.search;
    target.hash = window.location.hash;
  
    // استبدال صفحة التحويل في سجل المتصفح.
    window.location.replace(target.href);
  })();
  </script>
</head>
<body>
  <p>جارٍ تحويلك إلى الموقع...</p>
  <noscript>يرجى تفعيل JavaScript لإتمام إعادة التوجيه.</noscript>
</body>
</html>
